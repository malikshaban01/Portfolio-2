# /etc/nginx/sites-available/portfolio
#
# Nginx reverse-proxies to the Node server on :3000 and serves the built
# static assets directly from disk (bypassing Node) for better performance.
#
# Install with:
#   sudo cp nginx/portfolio.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Path to the Vite build output on the EC2 instance.
    root /var/www/portfolio/dist;
    index index.html;

    # Uploads (resume PDF, base64) can be ~7MB.
    client_max_body_size 12m;

    # Gzip text responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;

    # Static assets from the Vite build — hashed filenames, so cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other public files (favicon, resume PDF, profile image).
    location ~* \.(?:svg|jpg|jpeg|png|gif|ico|pdf|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API routes -> Node server. Buffering off so streaming/redirects behave.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Everything else -> SPA fallback (React Router handles /admin etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
